<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7fa" />
    <title>LIU YUSHAN — PORTFOLIO '26</title>

    <!--
      分享卡片 / SEO（2026-09-13 补）：
      之前 head 里没有任何 description 与 og: 标签，链接发到微信、邮件、简历里
      只会显示一行光秃秃的标题，没有描述也没有缩略图 —— 对作品集的第一印象损失很大。
      注意：下面的绝对地址目前指向 preview.ameyama.site。
      **等 ameyama.site 备案通过、正式上线时，这里连同 content.ts 里的域名一次性换成正式域名。**
    -->
    <meta
      name="description"
      content="刘雨姗的个人作品集 —— 日本文学 × 数据 × AI × 音乐 × 摄影。香港中文大学 2027 届 · 求职方向：AI 产品 / 策略 / 数据产品。"
    />
    <link rel="canonical" href="https://preview.ameyama.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="LIU YUSHAN" />
    <meta property="og:title" content="LIU YUSHAN — PORTFOLIO '26" />
    <meta
      property="og:description"
      content="刘雨姗的个人作品集 —— 日本文学 × 数据 × AI × 音乐 × 摄影。香港中文大学 2027 届 · 求职方向：AI 产品 / 策略 / 数据产品。"
    />
    <meta property="og:url" content="https://preview.ameyama.site/" />
    <meta property="og:image" content="https://preview.ameyama.site/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="刘雨姗的个人作品集 LIU YUSHAN — PORTFOLIO '26" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      字体自托管（2026-09-09）：原来这段是 Google Fonts 的 preconnect + css2。
      fonts.googleapis.com / fonts.gstatic.com 在国内会被墙或极慢，
      首屏会被这两个请求阻塞数秒、字体还会回退。现在拉丁字体下载到
      public/fonts/（latin + latin-ext 子集），中文字体走系统栈 —— 零外部依赖。
    -->
    <link rel="preload" as="style" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!--
      资源请求失败报告（整改方案 §4.3）：
      资源类 error 事件不冒泡，只能在捕获阶段拿到。这段脚本必须排在下面的
      preload 之前，才能保证 404 的预加载也被点名。
    -->
    <script>
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target
          if (!t || t === window) return
          var url = t.href || t.currentSrc || t.src
          if (!url) return
          if (t.tagName === 'LINK' && t.rel === 'preload') {
            console.error('[preload] 预加载失败，检查 assetManifest 与 index.html 是否漂移：', url)
          } else if (t.tagName === 'LINK' || t.tagName === 'IMG' || t.tagName === 'SCRIPT') {
            console.error('[asset] 资源请求失败：', url)
          }
        },
        true,
      )
    </script>

    <!--
      首屏关键预加载。**唯一事实来源是 src/experience/assetManifest.ts 里
      preload: true 的条目**，两边必须一一对应；开发模式下
      auditPreloadLinks() 会校验漂移，并确认 URL 真的返回 image/*
      而不是被 SPA fallback 用 HTML 冒充 200。
    -->
    <link rel="preload" as="image" type="image/webp" href="/assets/obj/posterwall.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/obj/findaword2.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/obj2/polaroids.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/obj2/doorDecals.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
